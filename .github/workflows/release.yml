name: Release

# Ein Tag wie v1.3.0 legt ein GitHub-Release an. Vorher wird geprüft, ob der Tag zur Version in
# unser_zuhause_agents/config.yaml passt; die Notizen kommen aus dem passenden Abschnitt in CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: Tag gegen Version prüfen, Notizen aus CHANGELOG.md
        run: python3 .github/scripts/check_addon.py release "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
