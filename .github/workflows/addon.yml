# Baut das Image für das Home-Assistant-Add-on (unser_zuhause_agents/config.yaml) und legt es in die GitHub Container Registry.
# Tag = „version“ aus config.yaml. Nach dem ersten Lauf die Pakete auf GitHub einmalig auf „Public“ stellen,
# sonst kann der Supervisor sie nicht laden.
name: Add-on-Image

on:
  push:
    branches: [main]
    paths:
      - app/**
      - agents/**
      - zeitplan.conf
      - Dockerfile
      - unser_zuhause_agents/config.yaml
      - .github/workflows/addon.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - name: Version aus config.yaml
        id: version
        run: |
          v=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' unser_zuhause_agents/config.yaml)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ghcr.io/sebastianinthewild/ha-unser-zuhause-agents-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/sebastianinthewild/ha-unser-zuhause-agents-${{ matrix.arch }}:latest
